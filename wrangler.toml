name = "oselya-telegram-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"
[triggers]
crons = ["0 * * * *"]
[[d1_databases]]
binding = "DB"
database_name = "oselya-bot-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"
[vars]
TIMEZONE = "Europe/Kyiv"
# ALLOWED_USERS = "123456789"
