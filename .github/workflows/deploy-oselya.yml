name: Deploy Oselya Telegram Bot
on:
  push:
    branches: [oselya-telegram-bot]
    paths:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy-oselya.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
    steps:
      - name: Check secrets
        id: check
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$BOT_TOKEN" || -z "$WEBHOOK_SECRET" || -z "$ALLOWED_USERS" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Waiting for 5 Actions secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BOT_TOKEN, WEBHOOK_SECRET, ALLOWED_USERS." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "$ALLOWED_USERS" =~ ^[0-9]+(,[0-9]+)*$ || ! "$WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{32,256}$ ]]; then
            echo "::error::Invalid ALLOWED_USERS or WEBHOOK_SECRET format."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Verify syntax
        if: steps.check.outputs.ready == 'true'
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Migrate and deploy Cloudflare Worker
        if: steps.check.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: d1 migrations apply oselya-bot-db --remote
          secrets: |
            ALLOWED_USERS
            WEBHOOK_SECRET
            BOT_TOKEN
        env:
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Register Telegram webhook
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node --input-type=module <<'JS'
          const raw = process.env.DEPLOYMENT_URL.trim().split(/\s+/)[0];
          if (!raw) throw new Error("Worker deployment URL is unavailable.");
          const base = raw.startsWith("https://") ? raw : "https://" + raw;
          const workerURL = new URL(base);
          if (workerURL.protocol !== "https:") throw new Error("Worker requires HTTPS.");
          const params = new URLSearchParams({
            url: new URL("/telegram", workerURL).href,
            secret_token: process.env.WEBHOOK_SECRET,
            allowed_updates: JSON.stringify(["message", "callback_query"])
          });
          const response = await fetch("https://api.telegram.org/bot" + process.env.BOT_TOKEN + "/setWebhook", {
            method: "POST",
            body: params
          });
          const result = await response.json();
          if (!response.ok || !result.ok) throw new Error("Webhook failed: " + (result.description || response.status));
          console.log("Oselya bot webhook active:", workerURL.href);
          JS

      - name: Summarize
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "✅ Oselya Worker deployed, D1 migrations applied, Telegram webhook registered." >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
