name: Deploy Oselya Telegram Bot
on:
  push:
    branches: [oselya-telegram-bot]
    paths:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy-oselya.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
    steps:
      - name: Check secrets
        id: check
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$BOT_TOKEN" || -z "$WEBHOOK_SECRET" || -z "$ALLOWED_USERS" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Waiting for 5 Actions secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BOT_TOKEN, WEBHOOK_SECRET, ALLOWED_USERS." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "$ALLOWED_USERS" =~ ^[0-9]+(,[0-9]+)*$ || ! "$WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{32,256}$ ]]; then
            echo "::error::Invalid ALLOWED_USERS or WEBHOOK_SECRET format."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Verify syntax
        if: steps.check.outputs.ready == 'true'
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Verify Cloudflare account and locate D1
        if: steps.check.outputs.ready == 'true'
        id: cloudflare
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const original = process.env.CLOUDFLARE_ACCOUNT_ID;
          const database = '16c0e74c-7a79-4ffc-b8d7-e40018564f44';
          const base = 'https://api.cloudflare.com/client/v4';
          async function api(path) {
            try {
              const response = await fetch(base + path, {
                headers: { Authorization: 'Bearer ' + token },
                signal: AbortSignal.timeout(12000)
              });
              return await response.json();
            } catch {
              return { success: false };
            }
          }
          const verification = await api('/user/tokens/verify');
          if (!verification.success || verification.result?.status !== 'active') {
            console.error('::error::Cloudflare API token is invalid, inactive, or cannot be verified. Check CLOUDFLARE_API_TOKEN.');
            process.exit(1);
          }
          const list = await api('/accounts?per_page=50');
          const accountIds = [original];
          if (list.success && Array.isArray(list.result)) {
            for (const account of list.result) {
              if (account.id && !accountIds.includes(account.id)) accountIds.push(account.id);
            }
          }
          let matched = null;
          for (const id of accountIds) {
            const result = await api('/accounts/' + encodeURIComponent(id) + '/d1/database/' + database);
            if (result.success && result.result?.uuid === database) {
              matched = id;
              break;
            }
          }
          if (!matched) {
            console.error('::error::Cloudflare token is active, but it cannot access oselya-bot-db. Check that CLOUDFLARE_ACCOUNT_ID is the account where the D1 was created, and that the API token has Account → D1 → Edit for that same account.');
            process.exit(1);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'account_id=' + matched + '\n');
          if (matched !== original) console.log('Found database in a different account visible to the token. Using the matching account automatically.');
          else console.log('Cloudflare account and D1 database match.');
          JS

      - name: Migrate and deploy Cloudflare Worker
        if: steps.check.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare.outputs.account_id }}
          preCommands: npx wrangler d1 migrations apply oselya-bot-db --remote
          secrets: |
            ALLOWED_USERS
            WEBHOOK_SECRET
            BOT_TOKEN
        env:
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}

      - name: Register Telegram webhook
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node --input-type=module <<'JS'
          const raw = process.env.DEPLOYMENT_URL.trim().split(/\s+/)[0];
          if (!raw) throw new Error("Worker deployment URL is unavailable.");
          const base = raw.startsWith("https://") ? raw : "https://" + raw;
          const workerURL = new URL(base);
          if (workerURL.protocol !== "https:") throw new Error("Worker requires HTTPS.");
          const params = new URLSearchParams({
            url: new URL("/telegram", workerURL).href,
            secret_token: process.env.WEBHOOK_SECRET,
            allowed_updates: JSON.stringify(["message", "callback_query"])
          });
          const response = await fetch("https://api.telegram.org/bot" + process.env.BOT_TOKEN + "/setWebhook", {
            method: "POST",
            body: params
          });
          const result = await response.json();
          if (!response.ok || !result.ok) throw new Error("Webhook failed: " + (result.description || response.status));
          console.log("Oselya bot webhook active:", workerURL.href);
          JS

      - name: Summarize
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "✅ Oselya Worker deployed, D1 migrations applied, Telegram webhook registered." >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
